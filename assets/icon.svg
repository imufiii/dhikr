<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bead" cx="38%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#F5E07A"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A5C0F"/>
    </radialGradient>
    <radialGradient id="marker" cx="38%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFBE0"/>
      <stop offset="45%"  stop-color="#E2C050"/>
      <stop offset="100%" stop-color="#6B4E0A"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#111827"/>

  <!-- String -->
  <g stroke="#C9A84C" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M 512.0 222.0 L 668.8 268.0"/>
    <path d="M 668.8 268.0 L 775.8 391.5"/>
    <path d="M 775.8 391.5 L 799.0 553.3"/>
    <path d="M 799.0 553.3 L 731.2 701.9"/>
    <path d="M 731.2 701.9 L 593.7 790.3"/>
    <path d="M 593.7 790.3 L 430.3 790.3"/>
    <path d="M 430.3 790.3 L 292.8 701.9"/>
    <path d="M 292.8 701.9 L 225.0 553.3"/>
    <path d="M 225.0 553.3 L 248.2 391.5"/>
    <path d="M 248.2 391.5 L 355.2 268.0"/>
    <path d="M 355.2 268.0 L 512.0 222.0"/>
  </g>

  <!-- Tassel string -->
  <line x1="512" y1="832" x2="512" y2="887" stroke="#C9A84C" stroke-width="5" opacity="0.7"/>

  <!-- Tassel strands -->
  <g stroke="#C9A84C" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="512" y1="887" x2="490" y2="977"/>
    <line x1="512" y1="887" x2="504"  y2="987"/>
    <line x1="512" y1="887" x2="520"  y2="987"/>
    <line x1="512" y1="887" x2="534" y2="977"/>
  </g>

  <!-- Tassel knot -->
  <ellipse cx="512" cy="887" rx="14" ry="10" fill="#C9A84C" opacity="0.9"/>

  <!-- Regular beads -->
  <circle cx="668.8" cy="268.0" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="775.8" cy="391.5" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="799.0" cy="553.3" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="731.2" cy="701.9" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="593.7" cy="790.3" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="430.3" cy="790.3" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="292.8" cy="701.9" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="225.0" cy="553.3" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="248.2" cy="391.5" r="30" fill="url(#bead)" filter="url(#glow)"/>
  <circle cx="355.2" cy="268.0" r="30" fill="url(#bead)" filter="url(#glow)"/>

  <!-- Marker bead (larger, brighter, at top) -->
  <circle cx="512.0" cy="222.0" r="42" fill="url(#marker)" filter="url(#glow)"/>
</svg>